[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# config.js is read at runtime to point the site at its API, so it must
# never be cached — otherwise changing the backend URL has no effect
# until browsers expire their copy.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"
