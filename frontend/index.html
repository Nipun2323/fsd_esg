<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="ESG reporting automation for SMEs — BRSR and CSRD aligned." />
    <title>Verdant ESG</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('esg.theme');
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Served as-is, not bundled: lets a deployed site be pointed at a
         different backend without rebuilding. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
