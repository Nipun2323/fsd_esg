# Render blueprint for the ESG API.
#
#   render.com -> New -> Blueprint -> pick this repository
#
# Render reads this file, provisions the database, builds the container
# and gives you a public URL.
#
# Uses the same Dockerfile as Cloud Run and Fly, so all three run an
# identical image rather than three slightly different environments.

services:
  - type: web
    name: fsd-esg-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      # Render injects PORT; the container's entrypoint binds to it.
      - key: DATABASE_URL
        fromDatabase:
          name: fsd-esg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

      # Import the 722 companies on the first boot. Set this back to
      # false in the dashboard once the first deploy has succeeded,
      # otherwise every cold start re-runs the import.
      - key: SEED_ON_BOOT
        value: "true"

      # Set these in the dashboard — never commit them.
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      # The frontend's exact origin, e.g. https://your-site.netlify.app
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: fsd-esg-db
    plan: free
    databaseName: esg
    user: esg
    region: singapore
