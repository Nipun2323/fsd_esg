# Full stack: frontend + API + MySQL.
#
#   cp backend/.env.example .env   # then set SECRET_KEY, GEMINI_API_KEY, passwords
#   docker compose up --build
#
# Frontend on http://localhost:8080, API on http://localhost:8000.

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8000"
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://esg:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@db:3306/esg
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-Admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-12345}
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: esg
      MYSQL_USER: esg
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  db-data:
